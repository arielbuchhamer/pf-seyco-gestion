spring.application.name=gestion

# Valores locales (contraseñas, SMTP) en backend/.env, que no se sube al repositorio.
# Copiar backend/.env.example como backend/.env y completarlo. Sin ese archivo se usan
# los valores por defecto de abajo.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seyco}?TimeZone=UTC
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Gestión de accesos ────────────────────────────────
# Sesiones con token opaco guardado en la tabla `sesiones` (header Authorization: Bearer).
# La duración de cada sesión sale de roles.token_duracion (minutos), no de acá.
app.cors.allowed-origins=http://localhost:4200

# URL pública del frontend (se usa en el link del correo de recuperación)
app.url=${APP_URL:http://localhost:4200}

# ── Correo (SMTP) ─────────────────────────────────────
# Sin MAIL_HOST no se envían correos: el link de recuperación se escribe en el log del backend.
# Gmail: MAIL_PASS debe ser una "contraseña de aplicación" (requiere verificación en 2 pasos).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Seyco S.A}

# ── Importación de proyectos desde Excel ──────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
