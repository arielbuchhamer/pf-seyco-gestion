spring.application.name=gestion

spring.datasource.url=jdbc:postgresql://localhost:5432/seyco?TimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Auth (JWT en cookie httpOnly) ─────────────────────
# En produccion, JWT_SECRET debe venir por variable de entorno (256 bits, ej. `openssl rand -base64 32`).
jwt.secret=${JWT_SECRET:cambiar-este-secreto-dev-minimo-32-bytes-1234567890}
jwt.expiration-ms=28800000
app.cookie.secure=false
app.cors.allowed-origins=http://localhost:4200
