<div class="shell">
  <header class="topbar">
    <button
      type="button"
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú"
    >
      <span></span><span></span><span></span>
    </button>
    <span class="topbar__brand">Seyco S.A</span>
    <button type="button" class="topbar__logout" (click)="logout()">Cerrar sesión</button>
  </header>

  @if (menuOpen()) {
    <button type="button" class="backdrop" aria-label="Cerrar menú" (click)="closeMenu()"></button>
    <nav class="menu">
      @if (visibleMenuItems().length > 0) {
        @for (item of visibleMenuItems(); track item.path) {
          <a class="menu__item" [routerLink]="item.path" (click)="closeMenu()">
            @switch (item.icon) {
              @case ('usuarios') {
                <svg class="menu__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6" />
                  <path
                    d="M4.5 19.5c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              }
              @case ('proyectos') {
                <svg class="menu__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
                  <rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6" />
                  <path d="M3.5 9.5h17" stroke="currentColor" stroke-width="1.6" />
                  <path d="M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              }
            }
            {{ item.label }}
          </a>
        }
      } @else {
        <p class="menu__empty">No hay opciones disponibles.</p>
      }
    </nav>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>
