<div class="shell">
  <app-sidebar
    (perfil)="perfilOpen.set(true)"
    (faqs)="faqOpen.set(true)"
    (cerrarSesion)="logout()"
  />

  <main class="content">
    <router-outlet />
  </main>

  @if (faqOpen()) {
    <app-faq-dialog (cerrar)="faqOpen.set(false)" />
  }

  @if (perfilOpen()) {
    <app-perfil-dialog (cerrar)="perfilOpen.set(false)" />
  }

  <app-snackbar />
</div>
