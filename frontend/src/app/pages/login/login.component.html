<div class="login-page">
  <section class="illustration">
    <span class="blob blob--one" aria-hidden="true"></span>
    <span class="blob blob--two" aria-hidden="true"></span>

    <span class="brand brand--on-illustration">
      <span class="brand__mark" aria-hidden="true">S</span>
      Seyco S.A
    </span>

    <div class="illustration__content" aria-hidden="true">
      <svg class="illustration__card" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="200" height="240" rx="24" fill="url(#cardGradient)" />
        <rect x="34" y="46" width="152" height="18" rx="9" fill="rgba(255,255,255,0.35)" />
        <rect x="34" y="80" width="100" height="12" rx="6" fill="rgba(255,255,255,0.25)" />
        <circle cx="110" cy="170" r="46" fill="rgba(255,255,255,0.14)" />
        <path
          d="M110 148a18 18 0 0 0-18 18v10h-4a6 6 0 0 0-6 6v26a6 6 0 0 0 6 6h44a6 6 0 0 0 6-6v-26a6 6 0 0 0-6-6h-4v-10a18 18 0 0 0-18-18Zm0 10a8 8 0 0 1 8 8v10h-16v-10a8 8 0 0 1 8-8Z"
          fill="#fff"
        />
        <defs>
          <linearGradient id="cardGradient" x1="10" y1="10" x2="210" y2="250" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2f6fed" />
            <stop offset="1" stop-color="#1c2b6b" />
          </linearGradient>
        </defs>
      </svg>
    </div>
  </section>

  <section class="panel">
    <div class="card">
      <span class="brand brand--mobile">
        <span class="brand__mark brand__mark--dark" aria-hidden="true">S</span>
        Seyco S.A
      </span>

      <form class="panel__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <h1>¡Bienvenido!</h1>
        <p class="subtitle">Por favor, ingresá tus datos.</p>

        @if (errorMessage()) {
          <p class="error" role="alert">{{ errorMessage() }}</p>
        }

        <label class="field">
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="tu@email.com"
            autofocus
          />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <small class="field__error">Ingresá un email válido.</small>
          }
        </label>

        <label class="field">
          <span>Contraseña</span>
          <div class="field__password">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="clave"
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="field__toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                  <path
                    d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.2 6.6C3.9 8.2 2.3 10.4 1.5 12c1.6 3.2 5.4 7.5 10.5 7.5 1.9 0 3.6-.5 5-1.3M14.3 4.9c-.7-.2-1.5-.3-2.3-.3-5.1 0-8.9 4.3-10.5 7.5.6 1.1 1.4 2.3 2.5 3.4"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                  <path
                    d="M1.5 12S5.3 4.5 12 4.5 22.5 12 22.5 12 18.7 19.5 12 19.5 1.5 12 1.5 12Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
                </svg>
              }
            </button>
          </div>
          @if (form.controls.clave.invalid && form.controls.clave.touched) {
            <small class="field__error">La contraseña es obligatoria.</small>
          }
        </label>

        <div class="panel__row">
          <!-- TODO: recuperar contraseña requiere flujo de reset por email — etapa futura -->
          <span class="link link--muted" aria-disabled="true">¿Olvidaste tu contraseña?</span>
        </div>

        <button type="submit" class="submit" [disabled]="loading()">
          {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
      </form>
    </div>
  </section>
</div>
