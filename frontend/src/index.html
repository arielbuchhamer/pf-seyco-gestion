<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Proxel · Gestión de proyectos y obras</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Tema claro/oscuro antes de que arranque Angular (evita un parpadeo claro). Ver TemaService. -->
  <script>
    try {
      var t = localStorage.getItem('proxel.tema');
      if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
